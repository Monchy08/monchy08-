[build]
  command = '''node -e 'const fs = require("node:fs"); const path = require("node:path"); const { files } = require("./site-release-2026-11-22.json"); for (const [name, encoded] of Object.entries(files)) { if (path.isAbsolute(name) || name.split("/").includes("..") || !/^(pagina web 2|netlify)\//.test(name)) throw new Error("Invalid release path: " + name); fs.mkdirSync(path.dirname(name), { recursive: true }); fs.writeFileSync(name, Buffer.from(encoded, "base64")); }''''
  functions = "netlify/functions"
  publish = "pagina web 2"

[[redirects]]
  from = "/.image-slots.state.json"
  to = "/image-slots-state.json"
  status = 200

[[headers]]
  for = "/wear/prueba-carrito*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
