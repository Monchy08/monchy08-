[build]
  functions = "netlify/functions"
  publish = "pagina web 2"

[[redirects]]
  from = "/.image-slots.state.json"
  to = "/image-slots-state.json"
  status = 200

# Página de diagnóstico del carrito (no indexar). En encantelia.com muestra "desactivada".
[[headers]]
  for = "/wear/prueba-carrito*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
